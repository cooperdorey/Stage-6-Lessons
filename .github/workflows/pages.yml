# Builds the lesson list and publishes the site on every push to main.
name: Publish lesson cards
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build lesson list and check lessons
        run: python3 scripts/build_manifest.py
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html favicon.ico manifest.json assets lessons _site/
          touch _site/.nojekyll
          # make browsers fetch the new styles and script after every update
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
